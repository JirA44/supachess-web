<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournoi Simulé — SupaChess</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #667eea 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 10px 20px; border-radius: 10px;
            cursor: pointer; font-size: 1rem; margin-bottom: 25px;
            text-decoration: none; transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.25); transform: translateX(-3px); }
        .header {
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            padding: 30px 40px; border-radius: 20px; margin-bottom: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }

        .setup-card {
            background: rgba(0,0,0,0.35); border-radius: 18px; padding: 30px;
            border: 1px solid rgba(255,215,0,0.3); margin-bottom: 25px;
        }
        .setup-card h2 { color: #ffd700; margin-bottom: 20px; font-size: 1.5rem; }
        .setup-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px; margin-bottom: 22px;
        }
        .setup-item label { font-size: 0.85rem; opacity: 0.7; display: block; margin-bottom: 6px; }
        .setup-item select {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
            color: #fff; font-size: 0.95rem; cursor: pointer; outline: none;
        }
        .setup-item select option { background: #1e3c72; }
        .start-btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            background: linear-gradient(90deg, #ffd700, #f97316);
            color: #1a1a2e; font-size: 1.15rem; font-weight: bold;
            cursor: pointer; transition: all 0.2s;
        }
        .start-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255,215,0,0.4); }
        .start-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .players-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 12px; margin-bottom: 25px;
        }
        .player-card {
            background: rgba(255,255,255,0.08); border-radius: 12px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.15); text-align: center;
        }
        .player-card.supa { border-color: #ffd700; background: rgba(255,215,0,0.1); }
        .player-card .elo-tag {
            font-size: 0.75rem; padding: 2px 8px; border-radius: 6px;
            background: rgba(255,255,255,0.1); margin-top: 6px; display: inline-block;
        }
        .player-card .score-big { font-size: 1.9rem; font-weight: bold; color: #4facfe; margin-top: 8px; }

        .section-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; color: #ffd700; }
        .crosstable-wrap { overflow-x: auto; margin-bottom: 25px; }
        .crosstable { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
        .crosstable th, .crosstable td {
            padding: 8px 11px; text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .crosstable th { background: rgba(0,0,0,0.4); font-weight: bold; }
        .crosstable td.win  { background: rgba(34,197,94,0.2); color: #22c55e; font-weight:bold; }
        .crosstable td.loss { background: rgba(239,68,68,0.2); color: #ef4444; }
        .crosstable td.draw { background: rgba(249,115,22,0.2); color: #f97316; }
        .crosstable td.self { background: rgba(0,0,0,0.3); }

        .standings { background: rgba(0,0,0,0.35); border-radius: 15px; padding: 20px; margin-bottom: 25px; }
        .stand-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .stand-row:last-child { border-bottom: none; }
        .rank { font-size: 1.2rem; font-weight: bold; min-width: 32px; }
        .rank.gold { color: #ffd700; }
        .rank.silver { color: #c0c0c0; }
        .rank.bronze { color: #cd7f32; }
        .player-name { flex: 1; font-weight: bold; }
        .supa-name { color: #ffd700; }
        .pts { font-size: 1.1rem; font-weight: bold; color: #4facfe; min-width: 55px; text-align: right; }
        .perf { font-size: 0.78rem; opacity: 0.6; }
        .wb { font-size: 0.82rem; opacity: 0.75; min-width: 80px; text-align: right; }

        .rounds-wrap { margin-bottom: 25px; }
        .round-item {
            background: rgba(255,255,255,0.06); border-radius: 10px; padding: 11px 15px;
            margin-bottom: 8px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 8px;
        }
        .round-item .match { font-size: 0.88rem; }
        .round-item .result {
            font-weight: bold; padding: 3px 10px; border-radius: 6px; font-size: 0.82rem;
        }
        .result.win  { background: rgba(34,197,94,0.2); color: #22c55e; border: 1px solid rgba(34,197,94,0.4); }
        .result.loss { background: rgba(239,68,68,0.2); color: #ef4444; border: 1px solid rgba(239,68,68,0.4); }
        .result.draw { background: rgba(249,115,22,0.2); color: #f97316; border: 1px solid rgba(249,115,22,0.4); }

        @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        .fade-in { animation: fadeIn 0.25s ease-out; }

        .winner-banner {
            background: linear-gradient(90deg,rgba(255,215,0,0.18),rgba(249,115,22,0.18),rgba(255,215,0,0.18));
            border: 1px solid rgba(255,215,0,0.5); border-radius: 15px; padding: 22px;
            text-align: center; margin-bottom: 25px;
        }
        .winner-banner h2 { color: #ffd700; font-size: 1.5rem; }
        .trophy { font-size: 3rem; margin: 8px 0; }

        .spinner { display: inline-block; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .reset-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 10px 22px; border-radius: 10px; cursor: pointer;
            font-size: 0.95rem; transition: all 0.2s; margin-top: 15px;
        }
        .reset-btn:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
<div class="container">
    <a class="back-btn" href="index.html">← Retour au Hub</a>

    <div class="header">
        <h1>🏆 Tournoi Simulé</h1>
        <p style="opacity:0.8; margin-top:8px;">SupaEngine vs les meilleurs moteurs du monde — Round Robin</p>
    </div>

    <div class="setup-card" id="setup-section">
        <h2>⚙️ Configuration du Tournoi</h2>
        <div class="setup-grid">
            <div class="setup-item">
                <label>Format</label>
                <select id="cfg-format">
                    <option value="rr">Round Robin (tous vs tous)</option>
                    <option value="rr2">Double Round Robin</option>
                </select>
            </div>
            <div class="setup-item">
                <label>Participants</label>
                <select id="cfg-players">
                    <option value="6">6 joueurs</option>
                    <option value="8" selected>8 joueurs</option>
                    <option value="10">10 joueurs</option>
                </select>
            </div>
            <div class="setup-item">
                <label>Niveau SupaEngine</label>
                <select id="cfg-level">
                    <option value="1200">~1200 ELO (Débutant)</option>
                    <option value="1600">~1600 ELO (Intermédiaire)</option>
                    <option value="2000" selected>~2000 ELO (Avancé)</option>
                    <option value="2500">~2500 ELO (Expert)</option>
                    <option value="3000">~3000 ELO (Maître)</option>
                    <option value="3150">~3150 ELO (SupaEngine v1.2)</option>
                </select>
            </div>
            <div class="setup-item">
                <label>Vitesse simulation</label>
                <select id="cfg-speed">
                    <option value="30">Rapide (instantané)</option>
                    <option value="200" selected>Normale (200ms)</option>
                    <option value="700">Lente (700ms)</option>
                </select>
            </div>
        </div>
        <button class="start-btn" id="start-btn" onclick="startTournament()">
            🏆 Lancer le Tournoi
        </button>
    </div>

    <div id="tournament-area"></div>
</div>

<script>
const ALL_ENGINES = [
    { name:'SupaEngine v1.2', elo:2000, icon:'🔮', isUs:true },
    { name:'Stockfish 17',    elo:3570, icon:'🐟' },
    { name:'Leela Chess Zero',elo:3550, icon:'🧠' },
    { name:'Komodo 14',       elo:3470, icon:'🦎' },
    { name:'Houdini 6',       elo:3410, icon:'🎩' },
    { name:'Rybka 4',         elo:3280, icon:'🐠' },
    { name:'Critter 1.6',     elo:3200, icon:'🦔' },
    { name:'Crafty 25',       elo:2960, icon:'🔨' },
    { name:'Fruit 2.1',       elo:2850, icon:'🍎' },
    { name:'Joker 1.7',       elo:2700, icon:'🃏' },
];

function expectedScore(eloA, eloB) {
    return 1 / (1 + Math.pow(10, (eloB - eloA) / 400));
}

function simulateGame(pA, pB) {
    const exp = expectedScore(pA.elo, pB.elo);
    const diff = Math.abs(pA.elo - pB.elo);
    const drawProb = Math.max(0.12, 0.42 - diff * 0.0004);
    const r = Math.random();
    if (r < drawProb) return [0.5, 0.5];
    if (r < drawProb + exp * (1 - drawProb)) return [1, 0];
    return [0, 1];
}

let players = [], results = [], standings = [], rounds = [], simInterval = null;

function startTournament() {
    const n = +document.getElementById('cfg-players').value;
    const lvl = +document.getElementById('cfg-level').value;
    const speed = +document.getElementById('cfg-speed').value;
    const format = document.getElementById('cfg-format').value;

    const engineList = JSON.parse(JSON.stringify(ALL_ENGINES));
    engineList[0].elo = lvl;
    players = engineList.slice(0, n);
    players.sort((a,b) => b.elo - a.elo);

    const matchups = [];
    const repeats = format === 'rr2' ? 2 : 1;
    for (let rep=0; rep<repeats; rep++) {
        for (let i=0; i<n; i++)
            for (let j=i+1; j<n; j++)
                matchups.push({ i, j });
    }
    rounds = matchups.map(m => ({ ...m, done:false, scoreI:null, scoreJ:null }));
    standings = players.map((p,i) => ({
        idx:i, name:p.name, elo:p.elo, icon:p.icon, isUs:!!p.isUs,
        pts:0, wins:0, losses:0, draws:0, games:0
    }));

    document.getElementById('start-btn').disabled = true;
    document.getElementById('start-btn').innerHTML = '<span class="spinner">⚙️</span> Simulation en cours...';
    renderTournamentUI();

    let roundIdx = 0;
    simInterval = setInterval(() => {
        if (roundIdx >= rounds.length) {
            clearInterval(simInterval);
            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').textContent = '🔄 Rejouer';
            finishTournament();
            return;
        }
        const r = rounds[roundIdx];
        const [si, sj] = simulateGame(players[r.i], players[r.j]);
        r.done = true; r.scoreI = si; r.scoreJ = sj;
        const si_ = standings.find(s=>s.idx===r.i);
        const sj_ = standings.find(s=>s.idx===r.j);
        si_.pts += si; si_.games++; sj_.pts += sj; sj_.games++;
        if (si===1) { si_.wins++; sj_.losses++; }
        else if (sj===1) { sj_.wins++; si_.losses++; }
        else { si_.draws++; sj_.draws++; }
        roundIdx++;
        renderLive();
    }, speed);
}

function renderTournamentUI() {
    document.getElementById('tournament-area').innerHTML = `
        <div class="players-grid" id="players-grid"></div>
        <div class="rounds-wrap">
            <div class="section-title">📋 Rondes en Direct</div>
            <div id="rounds-list"></div>
        </div>
        <div class="section-title">📊 Tableau Croisé</div>
        <div class="crosstable-wrap"><table class="crosstable" id="crosstable"></table></div>
        <div class="standings" id="standings-section">
            <div class="section-title">🏅 Classement Final</div>
            <div id="standings-list"></div>
        </div>
        <div style="text-align:center">
            <button class="reset-btn" onclick="resetTournament()">↺ Nouveau tournoi</button>
        </div>
    `;
    renderLive();
}

function renderLive() {
    // Players scores
    const sorted = [...standings].sort((a,b)=>b.pts-a.pts);
    document.getElementById('players-grid').innerHTML = sorted.map(s=>`
        <div class="player-card ${s.isUs?'supa':''}">
            <div style="font-size:1.4rem">${players[s.idx].icon}</div>
            <div style="font-weight:bold;font-size:0.88rem;margin-top:4px">${s.name}</div>
            <span class="elo-tag">${s.elo} ELO</span>
            <div class="score-big">${s.pts%1===0?s.pts:s.pts.toFixed(1)}</div>
            <div style="font-size:0.72rem;opacity:0.6;margin-top:4px">${s.wins}V ${s.draws}N ${s.losses}D</div>
        </div>`).join('');

    // Rounds
    const done = rounds.filter(r=>r.done);
    const list = document.getElementById('rounds-list');
    if (!done.length) { list.innerHTML = '<div style="opacity:0.5;padding:10px">En attente...</div>'; }
    else {
        list.innerHTML = done.slice(-12).reverse().map(r=>{
            const pA=players[r.i], pB=players[r.j];
            const rel = pA.isUs ? r.scoreI : pB.isUs ? r.scoreJ : null;
            let cls='', lbl='';
            if (rel===1){cls='win';lbl='Victoire';}
            else if(rel===0){cls='loss';lbl='Défaite';}
            else if(rel===0.5){cls='draw';lbl='Nulle';}
            const score = r.scoreI===1?'1-0':r.scoreI===0.5?'½-½':'0-1';
            return `<div class="round-item fade-in">
                <span class="match">${pA.icon} <b>${pA.name}</b> vs ${pB.icon} <b>${pB.name}</b></span>
                <span class="result ${cls}">${cls?lbl+' — ':''} ${score}</span>
            </div>`;
        }).join('');
    }

    // Crosstable
    const n = players.length;
    const sortedIdx = [...Array(n).keys()].sort((a,b)=>{
        const sa=standings.find(s=>s.idx===a), sb=standings.find(s=>s.idx===b);
        return sb.pts-sa.pts;
    });
    let ht = '<thead><tr><th>#</th><th style="text-align:left">Joueur</th>';
    for (let i=0;i<n;i++) ht += `<th>${i+1}</th>`;
    ht += '<th>Pts</th></tr></thead><tbody>';
    sortedIdx.forEach((pi,rank)=>{
        const p=players[pi], st=standings.find(s=>s.idx===pi);
        ht += `<tr>`;
        ht += `<td>${rank+1}</td>`;
        ht += `<td style="text-align:left;white-space:nowrap">${p.icon} <b>${p.name}</b></td>`;
        for (let j=0;j<n;j++){
            const pj=sortedIdx[j];
            if (pi===pj){ht+='<td class="self">★</td>';continue;}
            const r=rounds.find(r=>(r.i===pi&&r.j===pj)||(r.i===pj&&r.j===pi));
            if (!r||!r.done){ht+='<td>-</td>';continue;}
            const sc=r.i===pi?r.scoreI:r.scoreJ;
            const cl=sc===1?'win':sc===0?'loss':'draw';
            ht+=`<td class="${cl}">${sc===1?'1':sc===0?'0':'½'}</td>`;
        }
        ht+=`<td><b>${st.pts%1===0?st.pts:st.pts.toFixed(1)}</b></td></tr>`;
    });
    document.getElementById('crosstable').innerHTML = ht+'</tbody>';

    // Standings
    const supaS=standings.find(s=>s.isUs);
    document.getElementById('standings-list').innerHTML = sorted.map((s,i)=>{
        const rc=i===0?'gold':i===1?'silver':i===2?'bronze':'';
        const med=i===0?'🥇':i===1?'🥈':i===2?'🥉':'';
        const perf=s.games>0?Math.round(s.elo+400*(s.pts/s.games-0.5)):s.elo;
        return `<div class="stand-row fade-in">
            <span class="rank ${rc}">${med||'#'+(i+1)}</span>
            <span class="player-name ${s.isUs?'supa-name':''}">${players[s.idx].icon} ${s.name}</span>
            <span class="perf">Perf: ${perf}</span>
            <span class="wb">${s.wins}V ${s.draws}N ${s.losses}D</span>
            <span class="pts">${s.pts%1===0?s.pts:s.pts.toFixed(1)}</span>
        </div>`;
    }).join('');
}

function finishTournament() {
    const sorted = [...standings].sort((a,b)=>b.pts-a.pts);
    const winner = sorted[0];
    const supaRank = sorted.findIndex(s=>s.isUs)+1;
    const supaS = standings.find(s=>s.isUs);
    const banner = document.createElement('div');
    banner.className = 'winner-banner fade-in';
    banner.innerHTML = `
        <div class="trophy">${winner.isUs?'🏆':players[sorted[0].idx].icon}</div>
        <h2>${winner.isUs?'🎉 SupaEngine remporte le tournoi!':players[sorted[0].idx].icon+' '+winner.name+' remporte le tournoi!'}</h2>
        <p style="margin-top:8px;opacity:0.8">
            SupaEngine — <b>${supaRank}e place</b> | ${supaS.pts} pts | ${supaS.wins}V ${supaS.draws}N ${supaS.losses}D
        </p>
        ${supaRank<=3?'<p style="color:#ffd700;margin-top:8px;font-weight:bold">🌟 Podium atteint!</p>':''}
    `;
    const area = document.getElementById('tournament-area');
    area.insertBefore(banner, area.firstChild);
}

function resetTournament() {
    if (simInterval) clearInterval(simInterval);
    document.getElementById('tournament-area').innerHTML='';
    document.getElementById('start-btn').disabled=false;
    document.getElementById('start-btn').textContent='🏆 Lancer le Tournoi';
    document.getElementById('setup-section').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
