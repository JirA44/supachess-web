<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrainement Ouvertures — SupaChess</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #667eea 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 10px 20px; border-radius: 10px;
            cursor: pointer; font-size: 1rem; margin-bottom: 25px;
            text-decoration: none; transition: all 0.2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.25); transform: translateX(-3px); }
        .header {
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            padding: 30px 40px; border-radius: 20px; margin-bottom: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }

        /* Opening grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 15px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer; transition: all 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: #4facfe; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card.done { border-color: #22c55e; }
        .card h3 { font-size: 1.2rem; margin-bottom: 8px; color: #4facfe; }
        .card .sub { font-size: 0.85rem; opacity: 0.7; margin-bottom: 12px; }
        .card .moves { font-family: monospace; font-size: 0.9rem; opacity: 0.85; margin-bottom: 12px; line-height: 1.6; }
        .badge-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .badge {
            padding: 3px 10px; border-radius: 8px; font-size: 0.78rem;
            background: rgba(79,172,254,0.2); border: 1px solid rgba(79,172,254,0.4);
        }
        .badge.done-badge { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.4); }
        .progress-pill {
            font-size: 0.78rem; margin-left: auto; opacity: 0.7;
        }

        /* Detail panel */
        .detail-panel {
            display: none; background: rgba(0,0,0,0.45); backdrop-filter: blur(12px);
            border-radius: 20px; padding: 35px; border: 1px solid rgba(79,172,254,0.3);
            margin-bottom: 30px;
        }
        .detail-panel.visible { display: block; }
        .detail-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .detail-header h2 { font-size: 1.8rem; color: #4facfe; }
        .close-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;
        }
        .close-btn:hover { background: rgba(255,255,255,0.2); }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media(max-width:700px) { .two-col { grid-template-columns: 1fr; } }

        /* Board */
        .board-wrap { display: flex; justify-content: center; flex-direction: column; align-items: center; }
        .board {
            display: grid; grid-template-columns: repeat(8, 55px);
            grid-template-rows: repeat(8, 55px);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 4px; overflow: hidden;
        }
        .cell {
            width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; user-select: none;
        }
        .cell.light { background: #f0d9b5; }
        .cell.dark  { background: #b58863; }
        .cell.last  { background: rgba(249,115,22,0.55) !important; }
        .coord-row { display: flex; margin-top: 4px; }
        .coord-lbl { width: 55px; text-align: center; font-size: 0.72rem; opacity: 0.6; }

        /* Moves list */
        .moves-wrap { display: flex; flex-direction: column; gap: 8px; }
        .move-item {
            display: flex; align-items: center; gap: 12px;
            background: rgba(255,255,255,0.07); border-radius: 10px; padding: 10px 14px;
            border: 1px solid transparent; cursor: pointer; transition: all 0.2s;
        }
        .move-item.active { border-color: #4facfe; background: rgba(79,172,254,0.15); }
        .move-item.played { border-color: rgba(34,197,94,0.5); background: rgba(34,197,94,0.1); }
        .move-num { font-size: 0.8rem; opacity: 0.5; min-width: 25px; }
        .move-san { font-family: monospace; font-size: 1rem; font-weight: bold; }
        .move-color { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); flex-shrink: 0; }
        .move-color.w { background: #f0f0f0; }
        .move-color.b { background: #1a1a2e; }
        .move-desc { font-size: 0.82rem; opacity: 0.8; }

        .nav-row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
        .nav-btn {
            padding: 10px 22px; border-radius: 10px; border: none;
            font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: all 0.2s;
        }
        .nav-btn.prev { background: rgba(255,255,255,0.15); color: #fff; }
        .nav-btn.next { background: linear-gradient(90deg,#4facfe,#0072ff); color: #fff; }
        .nav-btn.done-btn { background: linear-gradient(90deg,#22c55e,#16a34a); color: #fff; }
        .nav-btn:hover { transform: translateY(-2px); }

        .theory-box {
            background: rgba(255,255,255,0.08); border-radius: 12px;
            padding: 18px; margin-top: 18px; line-height: 1.7;
            border-left: 3px solid #4facfe; font-size: 0.95rem;
        }
        .theory-box h4 { color: #4facfe; margin-bottom: 10px; }

        .overall-progress {
            background: rgba(0,0,0,0.35); border-radius: 15px; padding: 20px 25px;
            margin-bottom: 25px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
        }
        .progress-bar-bg {
            flex: 1; background: rgba(255,255,255,0.1); border-radius: 10px;
            height: 12px; overflow: hidden; min-width: 100px;
        }
        .progress-bar-fill {
            height: 100%; border-radius: 10px;
            background: linear-gradient(90deg,#4facfe,#22c55e);
            transition: width 0.5s;
        }
        .prog-lbl { font-size: 1rem; font-weight: bold; white-space: nowrap; }
    </style>
</head>

const DONE_KEY = 'supachess_openings_v1';
function getDone() {
    try { return JSON.parse(localStorage.getItem(DONE_KEY) || '[]'); } catch(e) { return []; }
}
function saveDone(arr) {
    try { localStorage.setItem(DONE_KEY, JSON.stringify(arr)); } catch(e) {}
}

let done = getDone();
let currentOpening = null;
let currentMoveIdx = -1;

// Minimal FEN → board position (just for initial position, we'll animate moves conceptually)
const START_BOARD = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
const PIECES = {
    'K':'♔','Q':'♕','R':'♖','B':'♗','N':'♘','P':'♙',
    'k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟'
};

function parseFen(fen) {
    let cells = [];
    const rows = fen.split(' ')[0].split('/');
    for (const row of rows) {
        for (const ch of row) {
            if (ch >= '1' && ch <= '8') { for (let i=0;i<+ch;i++) cells.push('.'); }
            else cells.push(ch);
        }
    }
    return cells;
}

function renderBoard(cells, lastMoves=[]) {
    let html = '<div class="board">';
    for (let r=0;r<8;r++) {
        for (let c=0;c<8;c++) {
            const idx = r*8+c;
            const isLight = (r+c)%2===0;
            const isLast = lastMoves.includes(idx);
            const piece = cells[idx] !== '.' ? (PIECES[cells[idx]] || '') : '';
            const col = piece && cells[idx]===cells[idx].toUpperCase() ? '#1a1a2e' : '#1a1a2e';
            html += `<div class="cell ${isLight?'light':'dark'}${isLast?' last':''}"><span style="color:${col}">${piece}</span></div>`;
        }
    }
    html += '</div>';
    html += '<div class="coord-row">';
    for (const f of ['a','b','c','d','e','f','g','h']) html += `<div class="coord-lbl">${f}</div>`;
    html += '</div>';
    return html;
}

function updateProgress() {
    const n = done.length;
    document.getElementById('prog-lbl').textContent = `${n}/8 ouvertures maîtrisées`;
    document.getElementById('prog-bar').style.width = `${(n/8)*100}%`;
}

function renderGrid() {
    const grid = document.getElementById('opening-grid');
    grid.innerHTML = OPENINGS.map((o,i) => {
        const isDone = done.includes(o.id);
        return `<div class="card ${isDone?'done':''}" onclick="openDetail(${i})">
            <h3>${o.icon} ${o.name}</h3>
            <div class="sub">${o.sub}</div>
            <div class="moves">${o.moves.slice(0,6).map((m,j)=>{
                const n = Math.floor(j/2)+1;
                return (j%2===0 ? `${n}. ` : '') + m.san;
            }).join(' ')} ...</div>
            <div class="badge-row">
                ${o.tags.map(t=>`<span class="badge${isDone?' done-badge':''}">${t}</span>`).join('')}
                ${isDone ? '<span style="margin-left:auto;color:#22c55e;font-size:0.85rem;">✅ Maîtrisée</span>' : ''}
            </div>
        </div>`;
    }).join('');
}

function openDetail(idx) {
    currentOpening = OPENINGS[idx];
    currentMoveIdx = -1;
    document.getElementById('detail-panel').classList.add('visible');
    document.getElementById('detail-panel').scrollIntoView({behavior:'smooth'});
    renderDetail();
}

function renderDetail() {
    const o = currentOpening;
    const isDone = done.includes(o.id);

    const panel = document.getElementById('detail-panel');

        <div class="two-col">

                <div class="nav-row">
                    <button class="nav-btn prev" onclick="prevMove()">← Précédent</button>
                    <button class="nav-btn next" onclick="nextMove()">Suivant →</button>

                </div>
                <div style="text-align:center; margin-top:10px; font-size:0.85rem; opacity:0.6;" id="move-counter">
                    Coup 0 / ${o.moves.length}
                </div>
            </div>
            <div>
                <div class="moves-wrap" id="moves-wrap">
                    ${o.moves.map((m,i) => {
                        const num = Math.floor(i/2)+1;
                        return `<div class="move-item" id="mi-${i}" onclick="goToMove(${i})">
                            <span class="move-num">${i%2===0 ? num+'.' : ''}</span>
                            <div class="move-color ${m.color}"></div>
                            <span class="move-san">${m.san}</span>
                            <span class="move-desc">${m.desc}</span>
                        </div>`;
                    }).join('')}
                </div>
                <div class="theory-box">
                    <h4>📚 Théorie</h4>
                    ${o.theory}
                </div>
            </div>
        </div>
    `;
}

function goToMove(idx) {
    currentMoveIdx = idx;
    highlightMove();
}

function nextMove() {
    if (currentMoveIdx < currentOpening.moves.length - 1) {
        currentMoveIdx++;
        highlightMove();
    }
}

function prevMove() {
    if (currentMoveIdx >= 0) {
        currentMoveIdx--;
        highlightMove();
    }
}

function highlightMove() {
    const items = document.querySelectorAll('.move-item');
    items.forEach((el, i) => {
        el.classList.remove('active','played');
        if (i === currentMoveIdx) el.classList.add('active');
        else if (i < currentMoveIdx) el.classList.add('played');
    });
    document.getElementById('move-counter').textContent =
        `Coup ${currentMoveIdx+1} / ${currentOpening.moves.length}`;
}

function markDone(id) {
    if (!done.includes(id)) { done.push(id); saveDone(done); }
    closeDetail();
    renderGrid();
    updateProgress();
}

function closeDetail() {
    document.getElementById('detail-panel').classList.remove('visible');
    currentOpening = null;
}

// Init
updateProgress();
renderGrid();
</script>
</body>
</html>
