        }
        .container { max-width: 1200px; margin: 0 auto; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);

        }
        .back-btn:hover { background: rgba(255,255,255,0.25); transform: translateX(-3px); }
        .header {
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            padding: 30px 40px; border-radius: 20px; margin-bottom: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 2.5rem; margin-bottom: 10px; }

        /* Opening grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px; margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.1); backdrop-filter: blur(10px);
            border-radius: 15px; padding: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer; transition: all 0.3s;
        }
        .card:hover { transform: translateY(-5px); border-color: #4facfe; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .card.done { border-color: #22c55e; }
        .card h3 { font-size: 1.2rem; margin-bottom: 8px; color: #4facfe; }
        .card .sub { font-size: 0.85rem; opacity: 0.7; margin-bottom: 12px; }
        .card .moves { font-family: monospace; font-size: 0.9rem; opacity: 0.85; margin-bottom: 12px; line-height: 1.6; }

            background: rgba(79,172,254,0.2); border: 1px solid rgba(79,172,254,0.4);

        .badge.done-badge { background: rgba(34,197,94,0.2); border-color: rgba(34,197,94,0.4); }
        .progress-pill {
            font-size: 0.78rem; margin-left: auto; opacity: 0.7;

            display: none; background: rgba(0,0,0,0.45); backdrop-filter: blur(12px);

        .close-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.3);

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        @media(max-width:700px) { .two-col { grid-template-columns: 1fr; } }

        .board-wrap { display: flex; justify-content: center; flex-direction: column; align-items: center; }
        .board {
            display: grid; grid-template-columns: repeat(8, 55px);
            grid-template-rows: repeat(8, 55px);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 4px; overflow: hidden;
        }
        .cell {
            width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; user-select: none;
        }
        .cell.light { background: #f0d9b5; }
        .cell.dark  { background: #b58863; }
        .cell.last  { background: rgba(249,115,22,0.55) !important; }
        .coord-row { display: flex; margin-top: 4px; }
        .coord-lbl { width: 55px; text-align: center; font-size: 0.72rem; opacity: 0.6; }

        .move-item {
            display: flex; align-items: center; gap: 12px;

            background: rgba(255,255,255,0.08); border-radius: 12px;

            border-left: 3px solid #4facfe; font-size: 0.95rem;

        .theory-box h4 { color: #4facfe; margin-bottom: 10px; }

            background: rgba(0,0,0,0.35); border-radius: 15px; padding: 20px 25px;

        }
        .progress-bar-bg {
            flex: 1; background: rgba(255,255,255,0.1); border-radius: 10px;
            height: 12px; overflow: hidden; min-width: 100px;
        }
        .progress-bar-fill {
            height: 100%; border-radius: 10px;
            background: linear-gradient(90deg,#4facfe,#22c55e);
            transition: width 0.5s;
        }
        .prog-lbl { font-size: 1rem; font-weight: bold; white-space: nowrap; }
    .card { appearance:none; color:#fff; text-align:left; font:inherit; width:100%; }

    .coord-lbl { width:auto; flex:1; }
    .detail-panel { padding:clamp(14px,4vw,35px); }

        { question:'Après 2...e6, quel plan noir décrit le Gambit Dame Refusé ?', choices:['Maintenir d5 et préparer un développement solide','Accepter le pion c4','Lancer immédiatement une attaque de mat'], answer:0, hints:['Le pion noir e6 soutient quel pion ?','Il renforce le pion d5.'], explanation:'...e6 soutient d5 et conduit à un développement solide.' }
    ],
    'king-indian': [
        { question:'Quel est le plan noir typique de l’Est-Indienne ?', choices:['Laisser souvent les Blancs occuper le centre puis le contester','Échanger automatiquement tous les pions centraux','Jouer sans développer les pièces'], answer:0, hints:['Le système est hypermoderne: le centre peut être contrôlé à distance.','Les ruptures ...e5 et ...c5 sont des idées fréquentes.'], explanation:'Les Noirs laissent souvent se former un centre blanc avant de l’attaquer par des ruptures.' },
        { question:'À quoi sert le fianchetto ...Bg7 dans cette ligne ?', choices:['Exercer une pression sur la grande diagonale','Défendre directement le pion c4','Empêcher le roque blanc'], answer:0, hints:['Trace la diagonale depuis g7.','Le fou vise vers le centre et l’aile dame.'], explanation:'Le fou g7 contrôle une longue diagonale et contribue à la pression sur le centre.' }
    ],
    french: [
        { question:'Quelle structure de pions caractérise la Défense Française dans cette ligne ?', choices:['e6 et d5','c6 et e5','a6 et b5'], answer:0, hints:['Rappelle les deux premiers coups noirs.','Le pion e avance d’abord en e6, puis le pion d en d5.'], explanation:'Les pions e6 et d5 forment la structure de base de cette ligne française.' },
        { question:'Pourquoi les Noirs préparent-ils souvent ...c5 ?', choices:['Pour contester le centre blanc','Pour protéger le roi en roquant','Pour enfermer le fou blanc'], answer:0, hints:['Quelle pièce blanche occupe le centre après e5 ?','...c5 attaque la base de la chaîne centrale.'], explanation:'...c5 est une rupture centrale qui attaque la base de la chaîne de pions blanche.' }
    ],
    'caro-kann': [
        { question:'Quel est l’intérêt de 1...c6 par rapport à ...e6 ?', choices:['Préparer ...d5 sans enfermer le fou c8 derrière un pion e6','Gagner un tempo sur la dame','Empêcher 2.d4'], answer:0, hints:['Observe la diagonale du fou c8 après ...d5.','Le pion c ne bloque pas cette diagonale.'], explanation:'...c6 prépare ...d5 tout en laissant le fou c8 plus libre que dans la Française.' },
        { question:'Dans la ligne, que fait 3...dxe4 ?', choices:['Échange le pion d contre le pion e4 et ouvre une ligne de jeu','Donne échec au roi blanc','Gagne une pièce'], answer:0, hints:['Le pion part de d5 et capture sur e4.','Ce coup est une prise de pion, pas un gain forcé de pièce.'], explanation:'Les Noirs échangent leur pion d contre le pion e4; la suite doit être calculée.' }
    ],
    english: [
        { question:'Que contrôle principalement 1.c4 ?', choices:['La case d5 depuis le flanc','La case e5 avec échec','La colonne f'], answer:0, hints:['Le pion c avance d’une case et attaque quelles cases ?','Depuis c4, le pion blanc contrôle d5.'], explanation:'1.c4 contrôle d5 depuis le flanc et prépare une lutte centrale flexible.' },
        { question:'Dans cette ligne, que cherche 3...d5 ?', choices:['Contester immédiatement le centre','Préparer le roque côté dame','Attaquer le cavalier c3'], answer:0, hints:['Le pion noir va de d7 à d5.','Il avance au centre face au pion c4.'], explanation:'...d5 est une rupture centrale qui conteste l’espace blanc.' }
    ],
    italian: [
        { question:'Pourquoi le fou blanc se place-t-il en c4 ?', choices:['Il vise notamment f7 et participe au contrôle du centre','Il protège le roi noir','Il attaque la tour a8'], answer:0, hints:['f7 est le point de départ du roi noir et n’est défendu que par le roi.','Le fou c4 regarde la diagonale vers f7.'], explanation:'Bc4 vise f7, une case sensible près du roi noir, et contribue au contrôle central.' },
        { question:'Que prépare 4.c3 dans le Giuoco Piano ?', choices:['La poussée centrale d4','Le roque côté dame','La prise en passant en f6'], answer:0, hints:['Le pion c3 soutient une avancée de quel pion ?','Le plan est de pousser le pion d vers d4.'], explanation:'c3 soutient l’idée d4; les Blancs doivent toutefois calculer les échanges au centre.' }
    ]
};

// Vary the correct answer's position so the knowledge check is not a "choose the first" pattern.
let quizQuestionNumber = 0;
Object.values(OPENING_QUIZZES).flat().forEach(question => {
    const correct = question.choices[question.answer];
    const distractors = question.choices.filter((_, index) => index !== question.answer);
    const correctSlot = quizQuestionNumber++ % question.choices.length;
    question.choices = distractors.slice();
    question.choices.splice(correctSlot, 0, correct);
    question.answer = correctSlot;
});

const DONE_KEY = 'supachess_openings_v1';
function getDone() {
    try {
        const saved = JSON.parse(localStorage.getItem(DONE_KEY) || '[]');
        return Array.isArray(saved) ? saved.filter(id => OPENINGS.some(opening => opening.id === id)) : [];
    } catch(e) { return []; }
}
function saveDone(arr) {
    try { localStorage.setItem(DONE_KEY, JSON.stringify(arr)); } catch(e) {}
}

let done = getDone();
let currentOpening = null;
let currentMoveIdx = -1;
let game = null;
let quizIndex = 0;
let quizMistakes = 0;
let quizNotice = '';

// Convert the current legal FEN into board cells for the lesson display.
const START_BOARD = 'rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR';
const PIECES = {
    'K':'♔','Q':'♕','R':'♖','B':'♗','N':'♘','P':'♙',
    'k':'♚','q':'♛','r':'♜','b':'♝','n':'♞','p':'♟'
};

function parseFen(fen) {
    let cells = [];
    const rows = fen.split(' ')[0].split('/');
    for (const row of rows) {
        for (const ch of row) {
            if (ch >= '1' && ch <= '8') { for (let i=0;i<+ch;i++) cells.push('.'); }
            else cells.push(ch);
        }
    }
    return cells;
}

function renderBoard(cells, lastMoves=[]) {
    let html = '<div class="board">';
    for (let r=0;r<8;r++) {
        for (let c=0;c<8;c++) {
            const idx = r*8+c;
            const isLight = (r+c)%2===0;
            const isLast = lastMoves.includes(idx);
            const piece = cells[idx] !== '.' ? (PIECES[cells[idx]] || '') : '';
            const isWhite = piece && cells[idx]===cells[idx].toUpperCase();
            const col = isWhite ? '#fff' : '#171717';
            const shadow = isWhite ? '0 1px 2px #000, 0 0 2px #000' : '0 1px 1px #fff8';
            html += `<div class="cell ${isLight?'light':'dark'}${isLast?' last':''}"><span style="color:${col};text-shadow:${shadow}">${piece}</span></div>`;
        }
    }
    html += '</div>';
    html += '<div class="coord-row">';
    for (const f of ['a','b','c','d','e','f','g','h']) html += `<div class="coord-lbl">${f}</div>`;
    html += '</div>';
    return html;
}

function updateProgress() {
    const n = done.length;
    document.getElementById('prog-lbl').textContent = `${n}/8 ouvertures maîtrisées`;
    document.getElementById('prog-bar').style.width = `${(n/8)*100}%`;
}

function renderGrid() {
    const grid = document.getElementById('opening-grid');
    grid.innerHTML = OPENINGS.map((o,i) => {
        const isDone = done.includes(o.id);
        return `<button type="button" class="card ${isDone?'done':''}" onclick="openDetail(${i})" aria-pressed="${isDone}">
            <h3>${o.icon} ${o.name}</h3>
            <div class="sub">${o.sub}</div>
            <div class="moves">${o.moves.slice(0,6).map((m,j)=>{
                const n = Math.floor(j/2)+1;
                return (j%2===0 ? `${n}. ` : '') + m.san;
            }).join(' ')} ...</div>
            <div class="badge-row">
                ${o.tags.map(t=>`<span class="badge${isDone?' done-badge':''}">${t}</span>`).join('')}
                ${isDone ? '<span style="margin-left:auto;color:#22c55e;font-size:0.85rem;">✅ Maîtrisée</span>' : ''}
            </div>
        </button>`;
    }).join('');
}

function openDetail(idx) {
    if (typeof Chess !== 'function') {
        document.getElementById('prog-lbl').textContent = 'Échiquier indisponible : recharge la page.';
        return;
    }
    currentOpening = OPENINGS[idx];
    currentMoveIdx = -1;
    game = new Chess();
    quizIndex = 0;
    quizMistakes = 0;
    quizNotice = '';
    document.getElementById('detail-panel').classList.add('visible');
    document.getElementById('detail-panel').scrollIntoView({behavior:'smooth'});
    renderDetail();
}

function renderDetail() {
    const o = currentOpening;
    const isDone = done.includes(o.id);
    const cells = parseFen(game ? game.fen() : START_BOARD);

    const panel = document.getElementById('detail-panel');
    panel.innerHTML = `
        <div class="detail-header">
            <h2>${o.icon} ${o.name}</h2>
            <button class="close-btn" onclick="closeDetail()">✕ Fermer</button>
        </div>
        <div class="two-col">
            <div>
                <div class="board-wrap" id="board-wrap">
                    ${renderBoard(cells)}
                </div>
                <div class="nav-row">
                    <button class="nav-btn prev" type="button" onclick="prevMove()">← Précédent</button>
                    <button class="nav-btn next" type="button" onclick="nextMove()">Suivant →</button>
                    ${isDone ? '<span class="badge done-badge" aria-label="Ouverture maîtrisée">✅ Maîtrisée</span>' : ''}
                </div>
                <div style="text-align:center; margin-top:10px; font-size:0.85rem; opacity:0.85;" id="move-counter" aria-live="polite">
                    Position initiale · 0 / ${o.moves.length} demi-coups
                </div>
                <p id="opening-feedback" role="status" aria-live="polite" style="margin-top:8px;min-height:1.5em;"></p>
            </div>
            <div>
                <div class="moves-wrap" id="moves-wrap">
                    ${o.moves.map((m,i) => {
                        const num = Math.floor(i/2)+1;
                        return `<button type="button" class="move-item" id="mi-${i}" onclick="goToMove(${i})" aria-label="Afficher la position après ${m.san}">
                            <span class="move-num">${i%2===0 ? num+'.' : ''}</span>
                            <div class="move-color ${m.color}"></div>
                            <span class="move-san">${m.san}</span>
                            <span class="move-desc">${m.desc}</span>
                        </button>`;
                    }).join('')}
                </div>
                <div class="theory-box">
                    <h4>📚 Théorie</h4>
                    ${o.theory}
                </div>
            </div>
        </div>
        <div id="opening-quiz" class="theory-box" hidden></div>
    `;
    updatePosition();
}

function squareIndex(square) {
    return (8 - Number(square[1])) * 8 + (square.charCodeAt(0) - 97);
}

function updatePosition() {
    if (!currentOpening || !game) return;
    game = new Chess();
    let lastMove = null;
    try {
        for (let i = 0; i <= currentMoveIdx; i++) {
            lastMove = game.move(currentOpening.moves[i].san);
            if (!lastMove) throw new Error('Coup illégal : ' + currentOpening.moves[i].san);
        }
    } catch (error) {
        const feedback = document.getElementById('opening-feedback');
        if (feedback) feedback.textContent = 'Ligne invalide : ' + error.message;
        return;
    }
    const squares = lastMove ? [squareIndex(lastMove.from), squareIndex(lastMove.to)] : [];
    document.getElementById('board-wrap').innerHTML = renderBoard(parseFen(game.fen()), squares);
    highlightMove();
    const counter = document.getElementById('move-counter');
    counter.textContent = currentMoveIdx < 0
        ? `Position initiale · 0 / ${currentOpening.moves.length} demi-coups`
        : `Après ${currentOpening.moves[currentMoveIdx].color === 'w' ? Math.floor(currentMoveIdx/2)+1+'.' : Math.floor(currentMoveIdx/2)+1+'...'} ${currentOpening.moves[currentMoveIdx].san} · ${currentMoveIdx+1} / ${currentOpening.moves.length} demi-coups`;
    const feedback = document.getElementById('opening-feedback');
    feedback.textContent = currentMoveIdx < 0 ? 'Utilise Suivant ou sélectionne un demi-coup pour suivre la ligne.' : currentOpening.moves[currentMoveIdx].desc;
    renderQuiz();
}

function goToMove(idx) {
    currentMoveIdx = Math.max(-1, Math.min(idx, currentOpening.moves.length - 1));
    updatePosition();
}

function nextMove() {
    if (currentMoveIdx < currentOpening.moves.length - 1) goToMove(currentMoveIdx + 1);
}

function prevMove() {
    if (currentMoveIdx >= 0) goToMove(currentMoveIdx - 1);
}

function highlightMove() {
    const items = document.querySelectorAll('.move-item');
    items.forEach((el, i) => {
        el.classList.remove('active','played');
        if (i === currentMoveIdx) el.classList.add('active');
        else if (i < currentMoveIdx) el.classList.add('played');
    });
    document.getElementById('move-counter').textContent =
        currentMoveIdx < 0 ? `Position initiale · 0 / ${currentOpening.moves.length} demi-coups` : `Position ${currentMoveIdx+1} / ${currentOpening.moves.length} demi-coups`;
}

function renderQuiz() {
    const panel = document.getElementById('opening-quiz');
    if (!panel || !currentOpening) return;
    const questions = OPENING_QUIZZES[currentOpening.id] || [];
    if (currentMoveIdx < currentOpening.moves.length - 1 || done.includes(currentOpening.id)) {
        panel.hidden = true;
        panel.innerHTML = '';
        return;
    }
    panel.hidden = false;
    if (quizIndex >= questions.length) {
        panel.innerHTML = `<h3>✅ Vérification acquise · ${questions.length}/${questions.length}</h3><p>Tu as parcouru la ligne et répondu correctement aux deux questions.</p><button type="button" class="nav-btn done-btn" onclick="markDone('${currentOpening.id}')">Valider la maîtrise</button>`;
        return;
    }
    const question = questions[quizIndex];
    const options = question.choices.map((choice, i) => `<button type="button" class="quiz-option" onclick="answerOpeningQuiz(${i})">${choice}</button>`).join('');
    const notice = quizNotice ? `<p class="quiz-feedback ${quizNotice.startsWith('Pas encore')?'error':'success'}" role="status" aria-live="polite">${quizNotice}</p>` : '';
    panel.innerHTML = `<h3>🧠 Vérifie ta compréhension · ${quizIndex+1}/${questions.length}</h3><p>${question.question}</p>${options}${notice}`;
}

function answerOpeningQuiz(choiceIndex) {
    const questions = OPENING_QUIZZES[currentOpening.id] || [];
    const question = questions[quizIndex];
    if (!question) return;
    if (choiceIndex === question.answer) {
        quizNotice = question.explanation;
        quizIndex++;
        quizMistakes = 0;
    } else {
        quizMistakes++;
        const hint = question.hints[Math.min(quizMistakes - 1, question.hints.length - 1)];
        quizNotice = `Pas encore. Indice ${quizMistakes} : ${hint}`;
    }
    renderQuiz();
}

function markDone(id) {
    const questions = OPENING_QUIZZES[id] || [];
    if (!currentOpening || currentOpening.id !== id || currentMoveIdx !== currentOpening.moves.length - 1 || quizIndex < questions.length) {
        const feedback = document.getElementById('opening-feedback');
        if (feedback) feedback.textContent = 'Parcours la ligne et réussis les deux questions avant de valider la maîtrise.';
        return;
    }
    if (!done.includes(id)) {
        done.push(id);
        saveDone(done);
        if (window.ChessNovaProgress) {
            ChessNovaProgress.recordPractice('ouvertures', 20, 'Ouverture maîtrisée');
            ChessNovaProgress.checkTrainingBadges();
        }
    }
    closeDetail();
    renderGrid();
    updateProgress();
}

function closeDetail() {
    document.getElementById('detail-panel').classList.remove('visible');
    currentOpening = null;
    game = null;
}

// Keyboard navigation for the opening trainer.
document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.altKey || e.metaKey) return;
    var tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
    if (!currentOpening) return;

    if (e.key === 'ArrowLeft') { e.preventDefault(); prevMove(); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); nextMove(); }
    else if (e.key === 'Home') { e.preventDefault(); goToMove(-1); }
    else if (e.key === 'End') { e.preventDefault(); goToMove(currentOpening.moves.length - 1); }
    else if (e.key === 'Escape') { closeDetail(); }
});

// Init
updateProgress();
renderGrid();
</script>
