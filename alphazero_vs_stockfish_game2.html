        function initBoard() {
            const board = document.getElementById('chessboard');
            board.innerHTML = '';
            const position = chess.board();

            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
                    square.dataset.row = row;
                    square.dataset.col = col;

                    const piece = position[row][col];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.textContent = pieceSymbols[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
                        pieceSpan.className = piece.color === 'w' ? 'piece-white' : 'piece-black';
                        square.appendChild(pieceSpan);
                    }

                    board.appendChild(square);
                }
            }
        }

            const brilliantEmojis = /[🌟⭐💎🔥⚡💥👑🏆]/;

            gameMoves.forEach((moveData, index) => {
                const moveItem = document.createElement('div');
                moveItem.className = 'move-item';

                const isBrilliant = moveData.comment && brilliantEmojis.test(moveData.comment);
                if (isBrilliant) {
                    moveItem.classList.add('brilliant');
                }

                const moveNumber = Math.floor(index / 2) + 1;
                const color = index % 2 === 0 ? '⚪' : '⚫';
                const moveNotation = isBrilliant && !moveData.move.includes('!!')
                    ? moveData.move.replace(/[!?]*$/, '') + '!!'
                    : moveData.move;

                moveItem.innerHTML = `
                    <div>
                        <span class="move-number">${color} ${moveNumber}.</span>
                        <span class="move-notation">${moveNotation}</span>
                    </div>
                    <div class="move-comment">${moveData.comment}</div>
                `;

                moveItem.onclick = () => goToMove(index);
                movesList.appendChild(moveItem);
            });
        }

        function updateMoveInfo() {
            const info = document.getElementById('moveInfo');
            if (currentMoveIndex === -1) {
                info.textContent = 'Position initiale';
            } else {
                const moveNumber = Math.floor(currentMoveIndex / 2) + 1;
                const color = currentMoveIndex % 2 === 0 ? 'Blancs' : 'Noirs';
                info.innerHTML = `<strong>Coup ${moveNumber}</strong> - ${color}: ${gameMoves[currentMoveIndex].move}`;
            }

            // Highlight active move - each move has its own item now
            document.querySelectorAll('.move-item').forEach((item, index) => {
                item.classList.remove('active');
                if (index === currentMoveIndex) {
                    item.classList.add('active');
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            });
        }

        function nextMove() {
            if (currentMoveIndex < gameMoves.length - 1) {
                currentMoveIndex++;
                const move = gameMoves[currentMoveIndex].move;
                if (move !== '1-0') {
                    try {
                        chess.move(move, { sloppy: true });
                        initBoard();
                        updateMoveInfo();
                    } catch (e) {
                        console.error('Erreur de coup:', move, e);
                    }
                } else {
                    updateMoveInfo();
                }
            }
        }

        function previousMove() {
            if (currentMoveIndex >= 0) {
                currentMoveIndex--;
                rebuildGame();
                updateMoveInfo();
            }
        }

        function goToStart() {
            currentMoveIndex = -1;
            chess.reset();
            initBoard();
            updateMoveInfo();
        }

        function goToEnd() {
            while (currentMoveIndex < gameMoves.length - 1) {
                nextMove();
            }
        }

        function goToMove(index) {
            if (index < currentMoveIndex) {
                currentMoveIndex = index;
                rebuildGame();
                updateMoveInfo();
            } else {
                while (currentMoveIndex < index) {
                    nextMove();
                }
            }
        }

        function rebuildGame() {
            chess.reset();
            for (let i = 0; i <= currentMoveIndex; i++) {
                const move = gameMoves[i].move;
                if (move !== '1-0') {
                    try {
                        chess.move(move, { sloppy: true });
                    } catch (e) {
                        console.error('Erreur de reconstruction:', move, e);
                    }
                }
            }
            initBoard();
        }

        // Initialisation
        initBoard();
        createMovesList();
        updateMoveInfo();

        // Navigation au clavier
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') previousMove();
            if (e.key === 'ArrowRight') nextMove();
            if (e.key === 'Home') goToStart();
            if (e.key === 'End') goToEnd();
        });
    

        // Afficher/masquer le PGN
        function togglePGN() {
            const section = document.getElementById('pgnSection');
            const content = document.getElementById('pgnContent');

            if (section.classList.contains('active')) {
                section.classList.remove('active');
            } else {
                // Générer le PGN depuis la variable gamePGN
                if (typeof gamePGN !== 'undefined') {
                    content.textContent = gamePGN;
                } else {
                    // Générer depuis l'objet game
                    content.textContent = game.pgn({ max_width: 80, newline_char: '\n' });
                }
                section.classList.add('active');
            }
        }

        // Copier le PGN dans le presse-papier
        function copyPGN() {
            const content = document.getElementById('pgnContent').textContent;
            navigator.clipboard.writeText(content).then(() => {
                alert('✅ PGN copié dans le presse-papier!');
            }).catch(err => {
                console.error('Erreur lors de la copie:', err);
                alert('❌ Erreur lors de la copie');
            });
        }

        // Télécharger le PGN
        function downloadPGN() {
            const content = document.getElementById('pgnContent').textContent;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'partie-' + new Date().toISOString().split('T')[0] + '.pgn';
            a.click();
            URL.revokeObjectURL(url);
            alert('✅ PGN téléchargé!');
        }

    </script>
