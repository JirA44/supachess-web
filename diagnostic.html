<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Coach - Diagnostic System</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', monospace;
            background: #0a0a1a;
            color: #eee;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #00d9ff; margin-bottom: 20px; }
        h2 { color: #667eea; margin: 30px 0 15px; border-bottom: 1px solid #333; padding-bottom: 10px; }

        .test-section {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .test-item {
            display: flex;
            align-items: center;
            padding: 10px;
            margin: 5px 0;
            background: rgba(0,0,0,0.3);
            border-radius: 5px;
            gap: 15px;
        }

        .status {
            width: 80px;
            padding: 5px 10px;
            border-radius: 5px;
            text-align: center;
            font-weight: bold;
            font-size: 0.85em;
        }
        .status.pending { background: #555; color: #aaa; }
        .status.testing { background: #f59e0b; color: #000; animation: pulse 1s infinite; }
        .status.pass { background: #10b981; color: #fff; }
        .status.fail { background: #ef4444; color: #fff; }
        .status.warn { background: #f97316; color: #fff; }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        .test-name { flex: 1; }
        .test-detail { color: #888; font-size: 0.9em; max-width: 400px; overflow: hidden; text-overflow: ellipsis; }
        .test-time { color: #667eea; width: 80px; text-align: right; }

        .btn {
            background: linear-gradient(90deg, #00d9ff, #667eea);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            margin: 10px 5px;
        }
        .btn:hover { transform: scale(1.02); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        .summary-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .summary-card .value { font-size: 2.5em; font-weight: bold; }
        .summary-card .label { color: #888; margin-top: 5px; }
        .summary-card.pass .value { color: #10b981; }
        .summary-card.fail .value { color: #ef4444; }
        .summary-card.warn .value { color: #f97316; }
        .summary-card.total .value { color: #00d9ff; }

        .log {
            background: #000;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85em;
            margin-top: 20px;
        }
        .log-entry { margin: 3px 0; }
        .log-entry.info { color: #00d9ff; }
        .log-entry.success { color: #10b981; }
        .log-entry.error { color: #ef4444; }
        .log-entry.warn { color: #f59e0b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Chess Coach - Système de Diagnostic</h1>
        <p style="color: #888; margin-bottom: 20px;">Tests automatiques pour vérifier que tout fonctionne correctement.</p>

        <div class="summary" id="summary">
            <div class="summary-card total"><div class="value" id="total-count">0</div><div class="label">Total Tests</div></div>
            <div class="summary-card pass"><div class="value" id="pass-count">0</div><div class="label">Réussis</div></div>
            <div class="summary-card fail"><div class="value" id="fail-count">0</div><div class="label">Échoués</div></div>
            <div class="summary-card warn"><div class="value" id="warn-count">0</div><div class="label">Avertissements</div></div>
        </div>

        <button class="btn" id="run-all" onclick="runAllTests()">▶️ Lancer Tous les Tests</button>
        <button class="btn" onclick="runStockfishTests()" style="background: linear-gradient(90deg, #667eea, #764ba2);">🤖 Test Stockfish</button>
        <button class="btn" onclick="runPGNTests()" style="background: linear-gradient(90deg, #10b981, #059669);">♟️ Test PGNs</button>

        <h2>🤖 Stockfish Engine</h2>
        <div class="test-section" id="stockfish-tests"></div>

        <h2>♟️ Parties Légendaires (PGN)</h2>
        <div class="test-section" id="pgn-tests"></div>

        <h2>🖼️ Ressources (Images, CDN)</h2>
        <div class="test-section" id="resource-tests"></div>

        <h2>📋 Log Détaillé</h2>
        <div class="log" id="log"></div>
    </div>

    <script>

            },
            {
                id: 'rotlewi-rubinstein-1907',
                title: 'Rubinstein Immortal',
                pgn: `[Event "Lodz"]

1. d4 d5 2. Nf3 e6 3. e3 c5 4. c4 Nc6 5. Nc3 Nf6 6. dxc5 Bxc5 7. a3 a6 8. b4 Bd6 9. Bb2 O-O 10. Qd2 Qe7 11. Bd3 dxc4 12. Bxc4 b5 13. Bd3 Rd8 14. Qe2 Bb7 15. O-O Ne5 16. Nxe5 Bxe5 17. f4 Bc7 18. e4 Rac8 19. e5 Bb6+ 20. Kh1 Ng4 21. Be4 Qh4 22. g3 Rxc3 23. gxh4 Rd2 24. Qxd2 Bxe4+ 25. Qg2 Rh3 0-1`

            {

                pgn: `[Event "IBM Man-Machine"]

            },
            {
                id: 'morphy-duke-1858',
                title: 'Morphy Opera Game',
                pgn: `[Event "Paris Opera"]
[Site "Paris"]
[Date "1858.11.02"]
[White "Paul Morphy"]
[Black "Duke of Brunswick"]
[Result "1-0"]

1. e4 e5 2. Nf3 d6 3. d4 Bg4 4. dxe5 Bxf3 5. Qxf3 dxe5 6. Bc4 Nf6 7. Qb3 Qe7 8. Nc3 c6 9. Bg5 b5 10. Nxb5 cxb5 11. Bxb5+ Nbd7 12. O-O-O Rd8 13. Rxd7 Rxd7 14. Rd1 Qe6 15. Bxd7+ Nxd7 16. Qb8+ Nxb8 17. Rd8# 1-0`
            }
        ];

        const stockfishUrls = [
            { name: 'LOCAL stockfish.js', url: 'stockfish.js' },
            { name: 'jsdelivr stockfish.wasm (CDN)', url: 'https://cdn.jsdelivr.net/npm/stockfish.wasm@0.10.0/stockfish.js' },
            { name: 'unpkg stockfish.js (CDN)', url: 'https://unpkg.com/stockfish.js@10.0.2/stockfish.js' }
        ];

        const resourceUrls = [
            { name: 'jQuery', url: 'https://code.jquery.com/jquery-3.6.0.min.js' },
            { name: 'chess.js', url: 'https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js' },
            { name: 'chessboard.js', url: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js' },
            { name: 'Pièce wK (Roi blanc)', url: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/wK.png' },
            { name: 'Pièce bQ (Dame noire)', url: 'https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/img/chesspieces/wikipedia/bQ.png' },
            { name: 'Chart.js', url: 'https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js' }
        ];

        // ========================================
        // LOGGING
        // ========================================

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = `[${time}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ========================================
        // TEST FRAMEWORK
        // ========================================

        let testResults = { pass: 0, fail: 0, warn: 0, total: 0 };

        function updateSummary() {
            document.getElementById('total-count').textContent = testResults.total;
            document.getElementById('pass-count').textContent = testResults.pass;
            document.getElementById('fail-count').textContent = testResults.fail;
            document.getElementById('warn-count').textContent = testResults.warn;
        }

        function createTestItem(container, id, name) {
            const div = document.createElement('div');
            div.className = 'test-item';
            div.id = 'test-' + id;
            div.innerHTML = `
                <span class="status pending">EN ATTENTE</span>
                <span class="test-name">${name}</span>
                <span class="test-detail"></span>
                <span class="test-time">-</span>
            `;
            document.getElementById(container).appendChild(div);
            return div;
        }

        function updateTest(id, status, detail = '', time = '') {
            const div = document.getElementById('test-' + id);
            if (!div) return;

            const statusEl = div.querySelector('.status');
            statusEl.className = 'status ' + status;
            statusEl.textContent = status === 'pass' ? '✓ RÉUSSI' :
                                   status === 'fail' ? '✗ ÉCHOUÉ' :
                                   status === 'warn' ? '⚠ ATTENTION' :
                                   status === 'testing' ? '⏳ TEST...' : 'EN ATTENTE';

            if (detail) div.querySelector('.test-detail').textContent = detail;
            if (time) div.querySelector('.test-time').textContent = time;

            if (status === 'pass') testResults.pass++;
            else if (status === 'fail') testResults.fail++;
            else if (status === 'warn') testResults.warn++;

            if (status !== 'testing' && status !== 'pending') {
                testResults.total++;
                updateSummary();
            }
        }

        // ========================================
        // STOCKFISH TESTS
        // ========================================

        async function runStockfishTests() {
            log('=== Début des tests Stockfish ===', 'info');

            for (let i = 0; i < stockfishUrls.length; i++) {
                const sf = stockfishUrls[i];
                const id = 'sf-' + i;
                createTestItem('stockfish-tests', id, sf.name);
                updateTest(id, 'testing');

                const start = Date.now();
                try {
                    const result = await testStockfishWorker(sf.url);
                    const time = Date.now() - start;

                    if (result.success) {
                        updateTest(id, 'pass', result.message, time + 'ms');
                        log(`✓ ${sf.name}: OK (${time}ms)`, 'success');
                    } else {
                        updateTest(id, 'fail', result.message, time + 'ms');
                        log(`✗ ${sf.name}: ${result.message}`, 'error');
                    }
                } catch (e) {
                    updateTest(id, 'fail', e.message, '-');
                    log(`✗ ${sf.name}: Exception - ${e.message}`, 'error');
                }
            }

            log('=== Fin des tests Stockfish ===', 'info');
        }

        function testStockfishWorker(url) {
            return new Promise((resolve) => {
                const timeout = setTimeout(() => {
                    resolve({ success: false, message: 'Timeout (10s)' });
                }, 10000);

                try {
                    const worker = new Worker(url);
                    let gotUciok = false;
                    let gotReadyok = false;

                    worker.onerror = (e) => {
                        clearTimeout(timeout);
                        worker.terminate();
                        resolve({ success: false, message: 'Worker error: ' + (e.message || 'Unknown') });
                    };

                    worker.onmessage = (e) => {
                        const line = e.data;
                        if (line === 'uciok') {
                            gotUciok = true;
                            worker.postMessage('isready');
                        } else if (line === 'readyok') {
                            gotReadyok = true;
                            clearTimeout(timeout);
                            worker.terminate();
                            resolve({ success: true, message: 'UCI + Ready OK' });
                        }
                    };

                    worker.postMessage('uci');
                } catch (e) {
                    clearTimeout(timeout);
                    resolve({ success: false, message: 'Creation failed: ' + e.message });
                }
            });
        }

        // ========================================
        // PGN TESTS
        // ========================================

        async function runPGNTests() {
            log('=== Début des tests PGN ===', 'info');

            for (let i = 0; i < legendaryGames.length; i++) {
                const game = legendaryGames[i];
                const id = 'pgn-' + i;
                createTestItem('pgn-tests', id, game.title);
                updateTest(id, 'testing');

                const start = Date.now();
                const result = testPGN(game.pgn);
                const time = Date.now() - start;

                if (result.success) {
                    updateTest(id, 'pass', `${result.moves} coups parsés`, time + 'ms');
                    log(`✓ ${game.title}: ${result.moves} coups`, 'success');
                } else {
                    updateTest(id, 'fail', result.error, time + 'ms');
                    log(`✗ ${game.title}: ${result.error}`, 'error');
                }
            }

            log('=== Fin des tests PGN ===', 'info');
        }

        function testPGN(pgn) {
            try {
                const chess = new Chess();
                const success = chess.load_pgn(pgn);

                if (!success) {
                    // Try cleaning the PGN
                    const cleanedPgn = pgn.replace(/\r\n/g, '\n').trim();
                    const success2 = chess.load_pgn(cleanedPgn);
                    if (!success2) {
                        return { success: false, error: 'PGN invalide (load_pgn failed)' };
                    }
                }

                const history = chess.history();
                if (history.length === 0) {
                    return { success: false, error: 'Aucun coup trouvé' };
                }

                return { success: true, moves: history.length };
            } catch (e) {
                return { success: false, error: e.message };
            }
        }

        // ========================================
        // RESOURCE TESTS
        // ========================================

        async function runResourceTests() {
            log('=== Début des tests Ressources ===', 'info');

            for (let i = 0; i < resourceUrls.length; i++) {
                const res = resourceUrls[i];
                const id = 'res-' + i;
                createTestItem('resource-tests', id, res.name);
                updateTest(id, 'testing');

                const start = Date.now();
                try {
                    const response = await fetch(res.url, { method: 'HEAD', mode: 'cors' });
                    const time = Date.now() - start;

                    if (response.ok) {
                        updateTest(id, 'pass', `HTTP ${response.status}`, time + 'ms');
                        log(`✓ ${res.name}: OK (${time}ms)`, 'success');
                    } else {
                        updateTest(id, 'fail', `HTTP ${response.status}`, time + 'ms');
                        log(`✗ ${res.name}: HTTP ${response.status}`, 'error');
                    }
                } catch (e) {
                    const time = Date.now() - start;
                    // CORS errors are common for CDNs, try with no-cors
                    try {
                        const response2 = await fetch(res.url, { method: 'GET', mode: 'no-cors' });
                        updateTest(id, 'warn', 'CORS bloqué mais ressource existe', time + 'ms');
                        log(`⚠ ${res.name}: CORS bloqué`, 'warn');
                    } catch (e2) {
                        updateTest(id, 'fail', e.message, time + 'ms');
                        log(`✗ ${res.name}: ${e.message}`, 'error');
                    }
                }
            }

            log('=== Fin des tests Ressources ===', 'info');
        }

        // ========================================
        // RUN ALL TESTS
        // ========================================

        async function runAllTests() {
            document.getElementById('run-all').disabled = true;
            document.getElementById('stockfish-tests').innerHTML = '';
            document.getElementById('pgn-tests').innerHTML = '';
            document.getElementById('resource-tests').innerHTML = '';
            document.getElementById('log').innerHTML = '';
            testResults = { pass: 0, fail: 0, warn: 0, total: 0 };
            updateSummary();

            log('🚀 Démarrage de tous les tests...', 'info');

            await runResourceTests();
            await runPGNTests();
            await runStockfishTests();

            log('✅ Tous les tests terminés!', 'success');
            log(`Résumé: ${testResults.pass} réussis, ${testResults.fail} échoués, ${testResults.warn} avertissements`, 'info');

            document.getElementById('run-all').disabled = false;
        }

        // Auto-run on load
        window.onload = () => {
            log('Page de diagnostic chargée. Cliquez sur "Lancer Tous les Tests" pour commencer.', 'info');
        };
    </script>
<script src="supa-dots-widget.js"></script>
</body>
</html>
