    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #252d3d;
            --text-primary: #e6e8eb;
            --text-secondary: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --border-color: #374151;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-card));
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            border: 1px solid var(--border-color);
        }

        h1 {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--accent-blue), #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .game-info {
            color: var(--text-secondary);
            margin-top: 1rem;
        }

        .main-content {
            display: grid;
            grid-template-columns: 500px 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .board-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border-color);
        }

        #board {
            width: 100%;
            margin-bottom: 1rem;
        }

        .controls {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .moves-section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 2rem;
            border: 1px solid var(--border-color);
            max-height: 700px;
            overflow-y: auto;
        }

        .move-item {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            border-left: 4px solid transparent;
        }

        .move-item:hover {
            border-left-color: var(--accent-blue);
            transform: translateX(4px);
        }

        .move-item.active {
            border-left-color: var(--accent-green);
            background: linear-gradient(90deg, var(--bg-secondary), var(--bg-card));
        }

        .move-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .move-number {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-blue);
        }

        .move-san {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .move-comment {
            color: var(--text-secondary);
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            transition: all 0.3s;
            z-index: 1000;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
    

        .pgn-section {
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid rgba(255,215,0,0.2);
            margin-top: 20px;
            display: none;
        }

        .pgn-section.active {
            display: block;
        }

        .pgn-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .pgn-header h3 {
            color: #ffd700;
            font-size: 1.3em;
        }

        .pgn-content {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.8;
            color: #fff;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .pgn-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .pgn-btn {
            background: linear-gradient(135deg, rgba(76,175,80,0.3), rgba(76,175,80,0.1));
            border: 2px solid #4caf50;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .pgn-btn:hover {
            background: linear-gradient(135deg, rgba(76,175,80,0.5), rgba(76,175,80,0.3));
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(76,175,80,0.4);
        }

        .pgn-btn.close {
            background: linear-gradient(135deg, rgba(244,67,54,0.3), rgba(244,67,54,0.1));
            border-color: #f44336;
        }

        .pgn-btn.close:hover {
            background: linear-gradient(135deg, rgba(244,67,54,0.5), rgba(244,67,54,0.3));
            box-shadow: 0 5px 15px rgba(244,67,54,0.4);
        }

        /* Brilliant Move Indicators */
        .move-item.brilliant, .move-card.brilliant, .timeline-move.brilliant {
            background: linear-gradient(135deg, rgba(255,215,0,0.2) 0%, rgba(255,165,0,0.15) 100%) !important;
            border-left: 4px solid #ffd700 !important;
            position: relative;
        }

        .move-item.brilliant::before, .move-card.brilliant::before, .timeline-move.brilliant::before {
            content: '';
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 1.2em;
            animation: brilliantPulse 1.5s ease-in-out infinite;
        }

        @keyframes brilliantPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        @keyframes brilliantGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(255,215,0,0.5); }
            50% { box-shadow: 0 0 20px rgba(255,215,0,0.8), 0 0 30px rgba(255,165,0,0.4); }
        }

        .brilliant-badge {
            display: inline-block;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            animation: badgeFadeIn 0.4s ease-out backwards;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #000;
            box-shadow: 0 2px 8px rgba(255,215,0,0.4);
        }

        @keyframes badgeFadeIn {
            from { opacity: 0; transform: translateY(-10px) scale(0.8); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .brilliant-factors {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,215,0,0.3);
        }

        .move-item.brilliant .move-comment, .move-card.brilliant .move-comment, .timeline-move.brilliant .move-comment {
            color: #ffd700 !important;
        }

    </style>

        let currentMoveIndex = -1;
        let game = new Chess();
        let board = null;

        function initBoard() {
            board = Chessboard('board', {
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            });
        }

        function renderMovesList() {
            const container = document.getElementById('moves-list');
            container.innerHTML = '';

            // Brilliant move detection emojis
            const brilliantEmojis = /[🌟⭐💎🔥⚡💥👑🏆]/;

            movesData.forEach((move, index) => {
                const moveDiv = document.createElement('div');
                moveDiv.className = 'move-item';
                moveDiv.id = `move-${index}`;
                moveDiv.onclick = () => goToMove(index);

                // Check for brilliant moves based on emojis in comments
                if (move.comment && brilliantEmojis.test(move.comment)) {
                    moveDiv.classList.add('brilliant');
                }

                const moveNumber = move.color === 'white' ? `${move.move_number}.` : `${move.move_number}...`;

                moveDiv.innerHTML = `
                    <div class="move-header">
                        <span class="move-number">${moveNumber}</span>
                        <span class="move-san">${move.san}</span>
                    </div>
                    <div class="move-comment">${move.comment}</div>
                `;

                container.appendChild(moveDiv);
            });
        }

        function goToMove(index) {
            game = new Chess();

            for (let i = 0; i <= index; i++) {
                game.move(movesData[i].uci);
            }

            board.position(game.fen());
            currentMoveIndex = index;

            document.querySelectorAll('.move-item').forEach(item => item.classList.remove('active'));
            const currentItem = document.getElementById(`move-${index}`);
            if (currentItem) {
                currentItem.classList.add('active');
                currentItem.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function nextMove() {
            if (currentMoveIndex < movesData.length - 1) {
                goToMove(currentMoveIndex + 1);
            }
        }

        function previousMove() {
            if (currentMoveIndex > 0) {
                goToMove(currentMoveIndex - 1);
            } else if (currentMoveIndex === 0) {
                goToStart();
            }
        }

        function goToStart() {
            game = new Chess();
            board.position('start');
            currentMoveIndex = -1;
            document.querySelectorAll('.move-item').forEach(item => item.classList.remove('active'));
        }

        function goToEnd() {
            goToMove(movesData.length - 1);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextMove();
            if (e.key === 'ArrowLeft') previousMove();
            if (e.key === 'Home') goToStart();
            if (e.key === 'End') goToEnd();
        });

        initBoard();
        renderMovesList();
    

        // Afficher/masquer le PGN
        function togglePGN() {
            const section = document.getElementById('pgnSection');
            const content = document.getElementById('pgnContent');

            if (section.classList.contains('active')) {
                section.classList.remove('active');
            } else {
                // Générer le PGN depuis la variable gamePGN
                if (typeof gamePGN !== 'undefined') {
                    content.textContent = gamePGN;
                } else {
                    // Générer depuis l'objet game
                    content.textContent = game.pgn({ max_width: 80, newline_char: '\n' });
                }
                section.classList.add('active');
            }
        }

        // Copier le PGN dans le presse-papier
        function copyPGN() {
            const content = document.getElementById('pgnContent').textContent;
            navigator.clipboard.writeText(content).then(() => {
                alert('✅ PGN copié dans le presse-papier!');
            }).catch(err => {
                console.error('Erreur lors de la copie:', err);
                alert('❌ Erreur lors de la copie');
            });
        }

        // Télécharger le PGN
        function downloadPGN() {
            const content = document.getElementById('pgnContent').textContent;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'partie-' + new Date().toISOString().split('T')[0] + '.pgn';
            a.click();
            URL.revokeObjectURL(url);
            alert('✅ PGN téléchargé!');
        }

    </script>
