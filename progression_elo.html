<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SupaEngine - Progression ELO</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff; min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        .header {
            background: rgba(0,0,0,0.4); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 15px; margin-bottom: 30px;
            text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 2.5rem; color: #4CAF50; margin-bottom: 10px; }
        .back-btn {
            display: inline-block; padding: 8px 20px; background: rgba(255,255,255,0.1);
            border-radius: 8px; color: #4CAF50; text-decoration: none; margin-bottom: 15px;
            border: 1px solid rgba(76,175,80,0.3);
        }
        .back-btn:hover { background: rgba(76,175,80,0.2); }
        .chart-container {
            background: rgba(0,0,0,0.3); border-radius: 15px; padding: 25px;
            margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1);
        }
        .chart-container h2 { margin-bottom: 15px; color: #4CAF50; }
        table {
            width: 100%; border-collapse: collapse; margin-top: 20px;
        }
        th, td {
            padding: 10px 15px; text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        th { color: #4CAF50; font-weight: 600; }
        .win { color: #4CAF50; }
        .loss { color: #ff6b6b; }
        .draw { color: #ffd700; }
        .empty-state { text-align: center; padding: 60px; opacity: 0.5; font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="hub.html" class="back-btn">< Hub</a>
        <div class="header">
            <h1>Progression ELO</h1>
            <p>Evolution des performances par session d'entrainement</p>
        </div>

        <div class="chart-container">
            <h2>Score % par niveau d'adversaire</h2>
            <canvas id="eloChart" height="300"></canvas>
        </div>

        <div class="chart-container">
            <h2>Learning Curve (mode progressif)</h2>
            <canvas id="curveChart" height="250"></canvas>
        </div>

        <div class="chart-container">
            <h2>Historique des parties</h2>
            <table id="gamesTable">
                <thead><tr><th>Date</th><th>Skill adv.</th><th>Resultat</th><th>Coups</th><th>Couleur</th></tr></thead>
                <tbody id="gamesBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const resp = await fetch('data/supaengine_elo.json');
                if (!resp.ok) throw new Error('No data');
                const data = await resp.json();
                render(data);
            } catch(e) {
                document.getElementById('gamesBody').innerHTML = '<tr><td colspan="5" style="text-align:center;opacity:0.5">Pas encore de donnees</td></tr>';
            }
        }

        function render(data) {
            const games = data.games || [];
            const curve = data.learning_curve || [];

            // Games table (last 50)
            const recent = games.slice(-50).reverse();
            const tbody = document.getElementById('gamesBody');
            tbody.innerHTML = recent.map(g => {
                const cls = g.result === 'WIN' ? 'win' : g.result === 'LOSS' ? 'loss' : 'draw';
                const date = g.date ? new Date(g.date).toLocaleDateString('fr-FR') : '-';
                return `<tr><td>${date}</td><td>${g.opponent_skill}</td><td class="${cls}">${g.result}</td><td>${g.moves}</td><td>${g.color}</td></tr>`;
            }).join('');

            // Score by skill level chart
            const bySkill = {};
            games.forEach(g => {
                if (!bySkill[g.opponent_skill]) bySkill[g.opponent_skill] = {w:0,d:0,l:0};
                if (g.result === 'WIN') bySkill[g.opponent_skill].w++;
                else if (g.result === 'DRAW') bySkill[g.opponent_skill].d++;
                else bySkill[g.opponent_skill].l++;
            });
            const skills = Object.keys(bySkill).sort((a,b) => a-b);
            const scores = skills.map(s => {
                const r = bySkill[s];
                const total = r.w + r.d + r.l;
                return total > 0 ? ((r.w + r.d * 0.5) / total * 100).toFixed(1) : 0;
            });

            new Chart(document.getElementById('eloChart'), {
                type: 'bar',
                data: {
                    labels: skills.map(s => `Skill ${s}`),
                    datasets: [{
                        label: 'Score %',
                        data: scores,
                        backgroundColor: scores.map(s => s >= 50 ? 'rgba(76,175,80,0.7)' : s >= 25 ? 'rgba(255,215,0,0.7)' : 'rgba(255,107,107,0.7)'),
                        borderRadius: 6,
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: true, max: 100, ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // Learning curve
            if (curve.length > 0) {
                new Chart(document.getElementById('curveChart'), {
                    type: 'line',
                    data: {
                        labels: curve.map(c => `Skill ${c.skill}`),
                        datasets: [
                            {
                                label: 'Win Rate %',
                                data: curve.map(c => c.win_rate),
                                borderColor: '#4CAF50',
                                backgroundColor: 'rgba(76,175,80,0.1)',
                                fill: true, tension: 0.3,
                            },
                            {
                                label: 'Q-Table Size',
                                data: curve.map(c => c.qtable_size),
                                borderColor: '#2196F3',
                                yAxisID: 'y1',
                                tension: 0.3,
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true, max: 100, ticks: { color: '#4CAF50' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                            y1: { position: 'right', beginAtZero: true, ticks: { color: '#2196F3' }, grid: { display: false } },
                            x: { ticks: { color: '#aaa' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                        },
                        plugins: { legend: { labels: { color: '#fff' } } }
                    }
                });
            }
        }

        loadData();
    </script>

<script src="/shared/i18n.js"></script>
<script src="/shared/community.js"></script>
<!-- /ChessNova Community -->
</body>
</html>
