        const moveTypes = {
            6: "good", 24: "brilliant", 40: "critical", 60: "critical",
            74: "critical", 82: "critical", 90: "brilliant"
        };

        let board = null;
        let game = new Chess();
        let currentMoveIndex = -1;
        let autoplayInterval = null;

        function initBoard() {
            const config = {
                draggable: false,
                position: 'start',
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png'
            };
            board = Chessboard('board', config);
            game.load_pgn(gamePGN);
            const moves = game.history();
            game.reset();
            updateMoveList(moves);
        }

        function updateMoveList(moves) {
            const moveList = document.getElementById('moveList');
            moveList.innerHTML = '';

            for (let i = 0; i < moves.length; i++) {
                const moveNum = Math.floor(i / 2) + 1;
                const isWhite = i % 2 === 0;
                const color = isWhite ? '⚪' : '⚫';
                const moveType = moveTypes[i] || '';

                const moveDiv = document.createElement('div');
                moveDiv.className = 'move-item ' + moveType;
                moveDiv.id = 'move-' + i;
                moveDiv.innerHTML = `<span style="color: #ffd700; font-weight: bold; margin-right: 8px;">${moveNum}.</span> ${color} ${moves[i]}${moveType ? ' 💡' : ''}`;
                moveDiv.onclick = () => goToMove(i);
                moveList.appendChild(moveDiv);
            }
        }

        function goToMove(index) {
            game.reset();
            game.load_pgn(gamePGN);
            const moves = game.history();
            game.reset();

            for (let i = 0; i <= index; i++) {
                game.move(moves[i]);
            }

            board.position(game.fen());
            currentMoveIndex = index;

            document.querySelectorAll('.move-item').forEach(el => el.classList.remove('active'));
            const elem = document.getElementById('move-' + index);
            if (elem) {
                elem.classList.add('active');
                elem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            const comment = moveComments[index] || "Position en cours...";
            document.getElementById('comment').innerHTML = comment;
        }

        function goToStart() {
            game.reset();
            board.position(game.fen());
            currentMoveIndex = -1;
            document.querySelectorAll('.move-item').forEach(el => el.classList.remove('active'));
            document.getElementById('comment').innerHTML = "🎯 <strong>Position de départ</strong><br><br>ZUP ULTIMATE (8 moteurs AI) affronte <strong>Stockfish 17.1</strong> (2 threads, 512MB hash, 3.0s/move). Une bataille historique va commencer!";
            stopAutoplay();
        }

        function previousMove() {
            if (currentMoveIndex >= 0) goToMove(currentMoveIndex - 1);
            else goToStart();
        }

        function nextMove() {
            game.reset();
            game.load_pgn(gamePGN);
            const moves = game.history();
            if (currentMoveIndex < moves.length - 1) goToMove(currentMoveIndex + 1);
        }

        function goToEnd() {
            game.reset();
            game.load_pgn(gamePGN);
            const moves = game.history();
            if (moves.length > 0) goToMove(moves.length - 1);
        }

        function autoplay() {
            if (autoplayInterval) {
                stopAutoplay();
                return;
            }
            autoplayInterval = setInterval(() => {
                game.reset();
                game.load_pgn(gamePGN);
                const moves = game.history();
                if (currentMoveIndex < moves.length - 1) nextMove();
                else stopAutoplay();
            }, 2500);
        }

        function stopAutoplay() {
            if (autoplayInterval) {
                clearInterval(autoplayInterval);
                autoplayInterval = null;
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') previousMove();
            if (e.key === 'ArrowRight') nextMove();
            if (e.key === 'Home') goToStart();
            if (e.key === 'End') goToEnd();
            if (e.key === ' ') { e.preventDefault(); autoplay(); }
        });

        $(document).ready(function() { initBoard(); });
    

        // Afficher/masquer le PGN
        function togglePGN() {
            const section = document.getElementById('pgnSection');
            const content = document.getElementById('pgnContent');

            if (section.classList.contains('active')) {
                section.classList.remove('active');
            } else {
                // Générer le PGN depuis la variable gamePGN
                if (typeof gamePGN !== 'undefined') {
                    content.textContent = gamePGN;
                } else {
                    // Générer depuis l'objet game
                    content.textContent = game.pgn({ max_width: 80, newline_char: '\n' });
                }
                section.classList.add('active');
            }
        }

        // Copier le PGN dans le presse-papier
        function copyPGN() {
            const content = document.getElementById('pgnContent').textContent;
            navigator.clipboard.writeText(content).then(() => {
                alert('✅ PGN copié dans le presse-papier!');
            }).catch(err => {
                console.error('Erreur lors de la copie:', err);
                alert('❌ Erreur lors de la copie');
            });
        }

        // Télécharger le PGN
        function downloadPGN() {
            const content = document.getElementById('pgnContent').textContent;
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'partie-' + new Date().toISOString().split('T')[0] + '.pgn';
            a.click();
            URL.revokeObjectURL(url);
            alert('✅ PGN téléchargé!');
        }

    </script>
